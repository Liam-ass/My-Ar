<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My AR Coloring</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
  mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.05; filterBeta: 10;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="myModel"
        src="./animation.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

 <a-entity mindar-image-target="targetIndex: 0">

  <a-entity
    rotation="90 0 0"
    position="0 0 0">

    <a-gltf-model
      src="#myModel"
      position="0 0 0"
      scale="0.17 0.17 0.1"
      animation-mixer="clip: *; loop: repeat">
    </a-gltf-model>

  </a-entity>

</a-entity>
  </a-scene>

</body>
</html>
